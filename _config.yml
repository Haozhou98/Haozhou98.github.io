# Site settings
title: "Haozhou (Hal) Zhou"
author: "Haozhou Zhou"
email: "zhou.haoz@northeastern.edu"
url: "https://haozhou98.github.io"
baseurl: ""

# Plugins (both are supported by GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown

# Posts live at /writing/<title>/
permalink: /writing/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: writing

# Kept out of the built site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - WEBPAGE_DEV_*.md
  - HAOZHOU98-*.md
  - .gitignore
  - node_modules
  - vendor
